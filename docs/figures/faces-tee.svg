<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="T-section in the DSTV reference pose">
  <rect width="640" height="400" fill="#ffffff"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">T-section (BT100*15) — DSTV reference pose (end view)</text>
  <text x="320" y="46" text-anchor="middle" font-size="12" fill="#6b7280">the standard draws a T with the flange vertical and the web pointing +v — this is what the letters are anchored to</text>

  <!-- flange: vertical plate (long axis = flange width b, along y) -->
  <g transform="translate(360,200) scale(1,-1)">
    <path d="M -73.5 -87.1 L -61 -87.1 L -61 87.1 L -73.5 87.1 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <!-- web: horizontal stub (length = half depth, along +x) -->
    <path d="M -61 -4.1 L 73.5 -4.1 L 73.5 4.1 L -61 4.1 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- flange width dimension (vertical) -->
  <line x1="270" y1="112.9" x2="270" y2="287.1" stroke="#9ca3af" stroke-width="1"/>
  <line x1="264" y1="112.9" x2="276" y2="112.9" stroke="#9ca3af" stroke-width="1"/>
  <line x1="264" y1="287.1" x2="276" y2="287.1" stroke="#9ca3af" stroke-width="1"/>
  <text x="258" y="200" text-anchor="middle" font-size="11" fill="#6b7280" transform="rotate(-90 258 200)">b = 134</text>

  <!-- leaders -->
  <line x1="293" y1="106" x2="293" y2="112" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="293" y1="288" x2="293" y2="326" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="285" y1="200" x2="247" y2="200" stroke="#059669" stroke-width="1.5"/>
  <line x1="435" y1="200" x2="473" y2="200" stroke="#059669" stroke-width="1.5"/>
  <line x1="293" y1="112" x2="330" y2="112" stroke="#2563eb" stroke-width="1"/>

  <!-- face chips -->
  <g>
    <rect x="245" y="60" width="96" height="26" rx="13" fill="#dbeafe" stroke="#2563eb"/>
    <text x="293" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">o = top</text>
  </g>
  <g>
    <rect x="245" y="326" width="96" height="26" rx="13" fill="#fee2e2" stroke="#dc2626"/>
    <text x="293" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">u = bottom</text>
  </g>
  <g>
    <rect x="153" y="187" width="94" height="26" rx="13" fill="#dcfce7" stroke="#059669"/>
    <text x="200" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">h = left</text>
  </g>
  <g>
    <rect x="473" y="187" width="94" height="26" rx="13" fill="#dcfce7" stroke="#059669"/>
    <text x="520" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">v = right</text>
  </g>

  <text x="320" y="374" text-anchor="middle" font-size="11" fill="#6b7280">flange b=134 (vertical), tf=9.6 · web d/2=103.5 (horizontal), tw=6.3, root r=8.9 mm</text>
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#b45309">T = one half of 200UB29.8 · our job stance (flange-down, web-up) is this pose rotated 90° CCW</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Equal/unequal angle face map, canonical stance L">
  <rect width="520" height="460" fill="#ffffff"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">UA150*90*12 — angle, canonical stance “L” (end view)</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#6b7280">longer leg horizontal (+x), shorter leg vertical (+y), open corner up-right</text>

  <!-- cross-section (drawn in section coords: +y up, flipped for SVG) -->
  <g transform="translate(260,225) scale(1,-1)">
    <path d="M -75 -45 L 75 -45 L 75 -33 L -63 -33 L -63 45 L -75 45 Z"
          fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- long-leg (150) dimension -->
  <line x1="185" y1="350" x2="335" y2="350" stroke="#9ca3af" stroke-width="1"/>
  <line x1="185" y1="344" x2="185" y2="356" stroke="#9ca3af" stroke-width="1"/>
  <line x1="335" y1="344" x2="335" y2="356" stroke="#9ca3af" stroke-width="1"/>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#6b7280">long leg = 150</text>

  <!-- leaders -->
  <line x1="191" y1="180" x2="191" y2="152" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="260" y1="270" x2="260" y2="300" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="185" y1="219" x2="134" y2="219" stroke="#059669" stroke-width="1.5"/>
  <line x1="335" y1="264" x2="374" y2="264" stroke="#059669" stroke-width="1.5"/>

  <!-- face chips -->
  <g>
    <rect x="143" y="126" width="96" height="26" rx="13" fill="#dbeafe" stroke="#2563eb"/>
    <text x="191" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">o = top</text>
  </g>
  <g>
    <rect x="212" y="300" width="96" height="26" rx="13" fill="#fee2e2" stroke="#dc2626"/>
    <text x="260" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">u = bottom</text>
  </g>
  <g>
    <rect x="40" y="206" width="94" height="26" rx="13" fill="#dcfce7" stroke="#059669"/>
    <text x="87" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">h = side</text>
  </g>
  <g>
    <rect x="374" y="251" width="94" height="26" rx="13" fill="#dcfce7" stroke="#059669"/>
    <text x="421" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">v = side</text>
  </g>

  <text x="260" y="398" text-anchor="middle" font-size="11" fill="#6b7280">UA150*90*12 · long leg 150 horizontal · short leg 90 vertical · t=12 · r1=10, r2=5 mm</text>
  <text x="260" y="416" text-anchor="middle" font-size="11" fill="#b45309">DSTV’s “L” reference pose is this same open-up-right stance:</text>
  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#b45309">o/u are on the vertical leg (top/bottom), v/h the outer faces (right/left)</text>
  <text x="260" y="448" text-anchor="middle" font-size="11" fill="#b45309">EA equal angles follow the identical map — confirm on the first real article</text>
</svg>

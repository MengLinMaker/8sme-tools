<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="DSTV reference face letters and view directions">
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker>
  </defs>
  <rect width="560" height="420" fill="#ffffff"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">DSTV / Tekla reference: face letters = view directions</text>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#6b7280">looking along the member (into the page), the four faces of any profile are placed like this</text>

  <!-- generic cross-section -->
  <rect x="195" y="140" width="170" height="170" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>

  <!-- o top -->
  <line x1="280" y1="92" x2="280" y2="134" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="280" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">o — Topview</text>
  <!-- u bottom -->
  <line x1="280" y1="358" x2="280" y2="316" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="280" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">u — Bottomview</text>
  <!-- h left -->
  <line x1="100" y1="225" x2="188" y2="225" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="94" y="217" text-anchor="end" font-size="13" font-weight="700" fill="#047857">h — Rearview</text>
  <!-- v right -->
  <line x1="460" y1="225" x2="372" y2="225" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="466" y="217" text-anchor="start" font-size="13" font-weight="700" fill="#047857">v — Frontview</text>

  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#6b7280">o / u are the vertical pair (top / bottom) · v / h are the horizontal pair (right / left) — so v is the RIGHT face, h the LEFT</text>
</svg>

    <text x="260" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">h = bottom</text>
  </g>
  <g>
    <rect x="22" y="197" width="94" height="26" rx="13" fill="#dcfce7" stroke="#059669"/>
    <text x="69" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">o = side</text>
  </g>
  <g>
    <rect x="404" y="197" width="94" height="26" rx="13" fill="#dcfce7" stroke="#059669"/>
    <text x="451" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">u = side</text>
  </g>

  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#6b7280">b=134 · d=207 · tf=9.6 · tw=6.3 · r=8.9 mm (AS/NZS 3679.1)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="200UB29.8 I-section face map, canonical stance H">
  <rect width="520" height="400" fill="#ffffff"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">200UB29.8 — I-section, canonical stance “H” (end view)</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#6b7280">depth horizontal, flanges vertical · the member runs into the page</text>

  <!-- cross-section (drawn in section coords: +x = depth, +y = flange width, flipped for SVG) -->
  <g transform="translate(260,210) scale(1,-1)">
    <path d="M 103.5 -67 L 103.5 67 L 93.9 67 L 93.9 3.15 L -93.9 3.15 L -93.9 67 L -103.5 67 L -103.5 -67 L -93.9 -67 L -93.9 -3.15 L 93.9 -3.15 L 93.9 -67 Z"
          fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- depth (d) dimension, horizontal -->
  <line x1="156.5" y1="94" x2="363.5" y2="94" stroke="#9ca3af" stroke-width="1"/>
  <line x1="156.5" y1="88" x2="156.5" y2="100" stroke="#9ca3af" stroke-width="1"/>
  <line x1="363.5" y1="88" x2="363.5" y2="100" stroke="#9ca3af" stroke-width="1"/>
  <text x="260" y="86" text-anchor="middle" font-size="12" fill="#6b7280">d = 207</text>

  <!-- flange (b) dimension, vertical -->
  <line x1="374" y1="143" x2="374" y2="277" stroke="#9ca3af" stroke-width="1"/>
  <line x1="368" y1="143" x2="380" y2="143" stroke="#9ca3af" stroke-width="1"/>
  <line x1="368" y1="277" x2="380" y2="277" stroke="#9ca3af" stroke-width="1"/>
  <text x="392" y="210" text-anchor="middle" font-size="12" fill="#6b7280" transform="rotate(90 392 210)">b = 134</text>

  <!-- leaders -->
  <line x1="260" y1="143" x2="260" y2="120" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="260" y1="277" x2="260" y2="300" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="156" y1="210" x2="128" y2="210" stroke="#059669" stroke-width="1.5"/>
  <line x1="364" y1="210" x2="392" y2="210" stroke="#059669" stroke-width="1.5"/>

  <!-- face chips -->
  <g>
    <rect x="212" y="64" width="96" height="26" rx="13" fill="#dbeafe" stroke="#2563eb"/>
    <text x="260" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">v = top</text>

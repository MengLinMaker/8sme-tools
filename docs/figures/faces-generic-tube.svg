<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Rectangular hollow section face map, canonical stance">
  <rect width="520" height="360" fill="#ffffff"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Generic RHS 150×100×9.0 (M) — canonical stance</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#6b7280">longer cross-section side horizontal · Tekla authors it long-vertical · member runs into the page</text>

  <!-- cross-section -->
  <g transform="translate(260,190) scale(1,-1)">
    <path d="M -75 -50 L 75 -50 L 75 50 L -75 50 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -66 -41 L -66 41 L 66 41 L 66 -41 Z" fill="#ffffff" stroke="#374151" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- width dimension -->
  <line x1="185" y1="118" x2="335" y2="118" stroke="#9ca3af" stroke-width="1"/>
  <line x1="185" y1="112" x2="185" y2="124" stroke="#9ca3af" stroke-width="1"/>
  <line x1="335" y1="112" x2="335" y2="124" stroke="#9ca3af" stroke-width="1"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#6b7280">150</text>

  <!-- height dimension -->
  <line x1="360" y1="140" x2="360" y2="240" stroke="#9ca3af" stroke-width="1"/>
  <line x1="354" y1="140" x2="366" y2="140" stroke="#9ca3af" stroke-width="1"/>
  <line x1="354" y1="240" x2="366" y2="240" stroke="#9ca3af" stroke-width="1"/>
  <text x="378" y="190" text-anchor="middle" font-size="12" fill="#6b7280" transform="rotate(90 378 190)">100</text>

  <!-- leaders -->
  <line x1="260" y1="140" x2="260" y2="132" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="260" y1="240" x2="260" y2="278" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="185" y1="190" x2="152" y2="190" stroke="#059669" stroke-width="1.5"/>
  <line x1="335" y1="190" x2="368" y2="190" stroke="#059669" stroke-width="1.5"/>

  <!-- face chips -->
  <g>
    <rect x="212" y="90" width="96" height="26" rx="13" fill="#dbeafe" stroke="#2563eb"/>
    <text x="260" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">h = top</text>
  </g>
  <g>
    <rect x="212" y="292" width="96" height="26" rx="13" fill="#fee2e2" stroke="#dc2626"/>
    <text x="260" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">v = bottom</text>
  </g>
  <g>
    <rect x="60" y="177" width="94" height="26" rx="13" fill="#dcfce7" stroke="#059669"/>
    <text x="107" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">u = side</text>
  </g>
  <g>
    <rect x="368" y="177" width="94" height="26" rx="13" fill="#dcfce7" stroke="#059669"/>
    <text x="415" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">o = side</text>
  </g>

  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#6b7280">RHS 150×100×9.0 (M) — o/u are the short side faces; h top / v bottom are the long faces</text>
</svg>
